<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Pokémon Stat Viewer</title>
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
    <h2 style="margin:0;">Pokémon Stat Viewer</h2>
  </header>

  <main style="max-width:520px; margin:36px auto;">
    <h3>Login</h3>
    <form id="login-form">
      <div style="margin-bottom:8px;">
        <label for="username">Username</label><br>
        <input id="username" name="username" type="text" required>
      </div>
      <div style="margin-bottom:8px;">
        <label for="password">Password</label><br>
        <input id="password" name="password" type="password" required>
      </div>
      <button type="submit" style="padding:8px 12px">Login</button>
      <button id="to-signup" type="button" style="padding:8px 12px; margin-left:8px">Create account</button>
    </form>

    <div id="login-status" style="margin-top:12px;color:var(--muted)"></div>
  </main>

  <script src="./js/auth.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const status = document.getElementById('login-status');
    document.getElementById('to-signup').addEventListener('click', ()=>{ location.href = './signup.html'; });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Logging in...';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const result = await authClient.login(username, password);
        // result.token available
        status.textContent = 'Login successful. Redirecting...';
        // save token and go to main page
        authClient.saveToken(result.token);
        window.location.href = '/'; // or './index.html'
      } catch (err) {
        status.textContent = err.message || 'Login failed';
      }
    });
  </script>
</body>
</html>
