<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPv6 Seeded Identity Demo</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }

    .card {
      background: #1f2937;
      padding: 32px;
      border-radius: 16px;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .result {
      font-size: 28px;
      margin: 24px 0;
      line-height: 1.4;
    }

    .label {
      color: #9ca3af;
      font-size: 14px;
      margin-top: 18px;
    }

    code {
      background: #111827;
      padding: 2px 6px;
      border-radius: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>IPv6 Seeded Random Identity</h1>

    <div class="result" id="result">
      Loading...
    </div>

    <div class="label">
      IPv6 Used As Seed:
    </div>

    <code id="ip">Fetching...</code>

    <div class="label" style="margin-top:24px;">
      Every visitor should consistently get the same combination,
      while different visitors usually get different combinations.
    </div>
  </div>

  <script>
    // ------------------------------------------------------------
    // WORD LISTS
    // ------------------------------------------------------------

    const animals = [
      "Fox",
      "Otter",
      "Falcon",
      "Tiger",
      "Wolf",
      "Rabbit",
      "Bear",
      "Panther",
      "Lynx",
      "Hawk"
    ];

    const foods = [
      "Pizza",
      "Sushi",
      "Taco",
      "Burger",
      "Ramen",
      "Pasta",
      "Curry",
      "Dumpling",
      "Burrito",
      "Paella"
    ];

    const colors = [
      "Crimson",
      "Azure",
      "Emerald",
      "Amber",
      "Violet",
      "Silver",
      "Indigo",
      "Coral",
      "Teal",
      "Gold"
    ];

    // ------------------------------------------------------------
    // HASH STRING -> 32-BIT NUMBER
    // ------------------------------------------------------------

    function hashString(str) {
      let hash = 2166136261;

      for (let i = 0; i < str.length; i++) {
        hash ^= str.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      return hash >>> 0;
    }

    // ------------------------------------------------------------
    // SEEDED RNG (Mulberry32)
    // ------------------------------------------------------------

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // ------------------------------------------------------------
    // PICK FROM ARRAY USING SEEDED RNG
    // ------------------------------------------------------------

    function pick(list, rng) {
      return list[Math.floor(rng() * list.length)];
    }

    // ------------------------------------------------------------
    // FETCH USER IP
    // ------------------------------------------------------------

    async function main() {
      try {
        // This service returns the user's public IP address.
        // Many users on IPv6 networks will receive an IPv6 address.
        const response = await fetch("https://api64.ipify.org?format=json");
        const data = await response.json();

        const ip = data.ip;

        document.getElementById("ip").textContent = ip;

        // Convert IP string into deterministic seed
        const seed = hashString(ip);

        // Create deterministic RNG
        const rng = mulberry32(seed);

        // Deterministically pick words
        const color = pick(colors, rng);
        const animal = pick(animals, rng);
        const food = pick(foods, rng);

        // Display result
        document.getElementById("result").innerHTML = `
          You are:<br><br>
          <strong>${color} ${animal}</strong><br>
          who enjoys <strong>${food}</strong>
        `;

      } catch (err) {
        console.error(err);

        document.getElementById("result").textContent =
          "Failed to fetch IP address.";
      }
    }

    main();
  </script>

</body>
</html>
